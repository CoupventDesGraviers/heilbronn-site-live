# Merge-on-green for trusted submitters: when submission-verify succeeds on a
# PR, this workflow merges it — but only if the author is listed in
# .github/trusted-submitters.txt (read from main, never from the PR), the PR
# only adds/modifies files under data/sources/external/, the PR head is still
# exactly the verified commit, and the ci "test" check has also succeeded on
# that commit. Everyone else's PR just waits for the maintainer.
#
# This replaces GitHub's auto-merge feature deliberately: the merge is an
# explicit act performed only after the required checks have actually
# succeeded on the verified sha, so no branch-protection or bypass subtlety
# can reorder it. Triggered by workflow_run, so it runs with write permission
# from the workflow definition on main and never executes PR code.
name: auto-merge

on:
  workflow_run:
    workflows: ["submission-verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write  # to dispatch publish-site after a merge

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/checkout@v4  # main — the trusted list and nothing else

      - name: Merge if trusted, submission-only, and all checks green
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          list=.github/trusted-submitters.txt
          [ -f "$list" ] || { echo "no trusted list"; exit 0; }

          # commits/{sha}/pulls misses fork PRs, so match open PRs by head sha
          prs=$(gh pr list --repo "$REPO" --state open --json number,headRefOid \
                  --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          [ -n "$prs" ] || { echo "no open PR for $SHA"; exit 0; }

          for pr in $prs; do
            author=$(gh pr view "$pr" --repo "$REPO" --json author -q .author.login)
            if ! grep -vE '^\s*(#|$)' "$list" | grep -ixq -- "$author"; then
              echo "PR #$pr: @$author not a trusted submitter — normal review"; continue
            fi
            head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid -q .headRefOid)
            if [ "$head" != "$SHA" ]; then
              echo "PR #$pr: head moved since verification — the new run will handle it"; continue
            fi
            author_lc=$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')
            bad=0
            while IFS= read -r line; do
              status=${line%% *}; path=${line#* }
              case "$status" in added|modified) ;; *) bad=1;; esac
              case "$path" in
                data/sources/external/*) ;;
                *) bad=1;;
              esac
            done < <(gh api "repos/$REPO/pulls/$pr/files" --paginate \
                       --jq '.[] | .status + " " + .filename')
            if [ "$bad" = 1 ]; then
              echo "PR #$pr: touches files outside the submission lane — normal review"; continue
            fi

            # ci must also be green on this exact commit (poll up to 10 min)
            ok=""
            for i in $(seq 1 40); do
              c=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
                    --jq '[.check_runs[] | select(.name=="test")][0].conclusion // "pending"')
              [ "$c" = "success" ] && { ok=1; break; }
              case "$c" in failure|cancelled|timed_out|action_required)
                echo "PR #$pr: ci test = $c — not merging"; break;;
              esac
              sleep 15
            done
            [ -n "$ok" ] || continue

            gh pr merge --squash "$pr" --repo "$REPO"
            echo "PR #$pr merged"
            # A merge by the Actions token emits no push event that triggers
            # workflows, and the publish-site cron is unreliable, so dispatch
            # the publish explicitly (workflow_dispatch is exempt from the
            # GITHUB_TOKEN no-retrigger rule).
            gh workflow run publish-site --repo "$REPO" || echo "::warning::publish-site dispatch failed; the cron will catch it"
          done
